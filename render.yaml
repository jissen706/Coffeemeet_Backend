services:
  - type: web
    name: coffeemeet-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://coffeemeet-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://coffeemeet-frontend.vercel.app
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
